<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Expense Tracker</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <main class="container">
    <header>
      <h1>Expense Tracker</h1>
      <p class="muted">Track, filter, edit, and summarize your spending.</p>
    </header>

    <section class="card">
      <h2 id="form-title">Add expense</h2>
      <form id="expense-form">
        <input type="hidden" id="expense-id" />

        <label for="title">Title *</label>
        <input id="title" name="title" maxlength="200" required />

        <label for="amount">Amount *</label>
        <input id="amount" name="amount" type="number" step="0.01" min="0.01" required />

        <label for="category">Category *</label>
        <select id="category" name="category" required>
          <option value="Food">Food</option>
          <option value="Transport">Transport</option>
          <option value="Shopping">Shopping</option>
          <option value="Bills">Bills</option>
          <option value="Entertainment">Entertainment</option>
          <option value="Other">Other</option>
        </select>

        <label for="date">Date *</label>
        <input id="date" name="date" type="date" required />

        <label for="note">Note</label>
        <textarea id="note" name="note" rows="3"></textarea>

        <div class="actions">
          <button type="submit" id="submit-button">Add expense</button>
          <button type="button" id="cancel-edit" class="secondary hidden">
            Cancel edit
          </button>
        </div>

        <p id="form-error" class="error hidden"></p>
      </form>
    </section>

    <section class="card">
      <h2>Current month summary</h2>
      <div id="summary">
        <p class="muted">Loading summary…</p>
      </div>
    </section>

    <section class="card">
      <h2>Expenses</h2>

      <div class="filters">
        <input id="filter-title" placeholder="Search title…" />
        <select id="filter-category">
          <option value="">All categories</option>
          <option value="Food">Food</option>
          <option value="Transport">Transport</option>
          <option value="Shopping">Shopping</option>
          <option value="Bills">Bills</option>
          <option value="Entertainment">Entertainment</option>
          <option value="Other">Other</option>
        </select>
        <input id="filter-from" type="date" />
        <input id="filter-to" type="date" />
        <button id="apply-filters">Apply filters</button>
        <button id="clear-filters" class="secondary">Clear</button>
      </div>

      <p id="list-error" class="error hidden"></p>
      <div id="expense-list" class="expense-list"></div>
    </section>
  </main>

  <script src="/app.js"></script>
</body>
</html>
